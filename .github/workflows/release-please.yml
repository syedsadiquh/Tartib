name: Release

# release-please opens a "Release PR" from the commits merged since the last
# tag. Merging that PR creates the tag, the GitHub Release and CHANGELOG.md, and
# bumps the version in backend/pyproject.toml and web/package.json (12-versioning.md §3).
#
# It runs on main: `develop` is the integration branch, `main` is what ships.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # The manifest plus the config file; the action commits the version
          # bumps it finds in `extra-files`.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

name: Tracker

# Keeps the GitHub tracker consistent without anyone having to remember it:
# the area label comes from the PR title's scope, a PR that links nothing fails
# unless it is a repo chore carrying the `no-issue` label, and a PR merged into
# `develop` closes the work-package issue it claims with `Closes #N` (GitHub
# itself only auto-closes on merges into the default branch, `main`).
#
# Milestones stay on issues only. A PR that inherits its issue's milestone makes
# the milestone's progress bar count merged PRs as finished packages, so this
# workflow deliberately does not copy it.
#
# See docs/plans/README.md.

on:
  pull_request:
    # `labeled` so adding `no-issue` after a failed run clears it without a
    # manual re-run; without it the escape hatch only works if the label is set
    # before the first run. `closed` drives the close-on-merge job.
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: tracker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-and-link:
    name: label-and-link
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'release-please[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Sync the area label
        env:
          GH_TOKEN: ${{ github.token }}
          # gh infers the repo from the working directory's git remote. This job
          # never checks out, so without GH_REPO every `gh pr edit` dies with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # 1. area label from the Conventional Commit scope in the title
          scope=$(printf '%s' "$TITLE" | sed -nE 's/^[a-z]+\(([a-z]+)\)!?: .*/\1/p')
          case "$scope" in
            api|web|worker|engine|db|deploy|bot|integrations|repo) area="area:$scope" ;;
            ci|docs|plans|release|deps|test) area="area:repo" ;;
            *) area="" ;;
          esac
          if [ -n "$area" ]; then
            case ",$LABELS," in
              *",$area,"*) ;;
              *) gh pr edit "$PR" --add-label "$area" >/dev/null
                 echo "labelled $area" ;;
            esac
          fi

          # 2. the first issue this PR claims, in the body
          issue=$(printf '%s' "$BODY" | grep -oiE '(closes|fixes|resolves|part of|refs?) #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)

          # 3. no linked issue is only allowed for repo chores, and only on purpose
          if [ -z "$issue" ]; then
            case ",$LABELS," in
              *",no-issue,"*) echo "::notice::no issue linked, the no-issue label is set" ; exit 0 ;;
            esac
            echo "::error title=No work package linked::Add 'Closes #N' (completes a package) or 'Part of #N' (one slice of it) to the PR body, or the 'no-issue' label for a repo chore." >&2
            exit 1
          fi

          echo "::notice::linked to #$issue"

  close-packages:
    name: close-packages
    # Only a completed PR into `develop` closes its package. `Part of #N` never
    # closes: a slice is not the package. A PR into `main` is left to GitHub's
    # own default-branch auto-close.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Close the work-package issues this PR completed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Only completing keywords close. `Part of #N`, `Refs #N` and plain
          # `#N` mentions stay open.
          issues=$(printf '%s' "$BODY" \
            | grep -oiE '(closes|fixes|resolves) #[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$issues" ]; then
            echo "::notice::no completing reference in #$PR, nothing to close"
            exit 0
          fi

          for n in $issues; do
            # "open issue" / "closed issue" / "open pr" / "closed pr" / "missing"
            kind=$(gh api "repos/$GH_REPO/issues/$n" \
              --jq '"\(.state) \(if .pull_request then "pr" else "issue" end)"' 2>/dev/null \
              || echo "missing")
            case "$kind" in
              "open issue")
                gh issue close "$n" --reason completed >/dev/null
                echo "closed #$n (completed by #$PR)"
                ;;
              "closed issue")
                echo "::notice::#$n is already closed"
                ;;
              "open pr"|"closed pr")
                echo "::warning::#$n is a pull request, not an issue — skipping"
                ;;
              *)
                echo "::warning::#$n could not be read, skipping"
                ;;
            esac
          done

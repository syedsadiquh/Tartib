[project]
name = "scheduler"
version = "0.1.0"
description = "Tartib — prayer-first scheduling backend (API, engine, worker)"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.40",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.18",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.3",
    "google-api-python-client>=2.180",
    "notion-client>=2.5",
    "adhanpy>=1.0",
    "webauthn>=2.7",
    "pywebpush>=2.0",
    "cryptography>=46",
]

[project.scripts]
scheduler-cli = "scheduler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7",
    "hypothesis>=6.140",
    "time-machine>=3",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx2>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
warn_unused_configs = true
files = ["src/scheduler"]

[[tool.mypy.overrides]]
module = "scheduler.engine.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

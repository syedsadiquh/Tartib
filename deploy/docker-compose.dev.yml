# Local development services only (F-04). App processes run on the host via `make dev-*`.
name: tartib-dev
services:
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: tartib
      POSTGRES_USER: tartib
      POSTGRES_PASSWORD: tartib
    ports: ["5433:5432"]
    volumes:
      - pgdev:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tartib"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdev: {}
